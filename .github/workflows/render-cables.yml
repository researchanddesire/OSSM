name: Render Cable Harnesses

on:
  push:
    branches: [main, staging]
    paths:
      - hardware/cables/*.yml
      - hardware/cables/*.yaml
      - hardware/cables/images/**
      - scripts/render-cables.sh
      - requirements-cables.txt
      - .github/workflows/render-cables.yml
  pull_request:
    paths:
      - hardware/cables/*.yml
      - hardware/cables/*.yaml
      - hardware/cables/images/**
      - scripts/render-cables.sh
      - requirements-cables.txt
      - .github/workflows/render-cables.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-cables-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cables.txt
      - name: Install WireViz and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz
          python -m pip install -r requirements-cables.txt
      - name: Render diagrams and cable BOMs
        run: bash scripts/render-cables.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cable-export
          path: cable-export/
          if-no-files-found: error

  update-preview:
    needs: render
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'staging')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cable-export
          path: cable-export/
      - name: Update cable diagrams and BOMs
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$SOURCE_BRANCH"
          if ! git diff --quiet "$SOURCE_SHA" FETCH_HEAD -- \
            'hardware/cables/*.yml' 'hardware/cables/*.yaml' \
            hardware/cables/images scripts/render-cables.sh \
            requirements-cables.txt .github/workflows/render-cables.yml; then
            echo "Harness inputs changed; a newer run will update the previews."
            exit 0
          fi
          git checkout -B "$SOURCE_BRANCH" FETCH_HEAD
          mkdir -p hardware/cables/generated
          cp cable-export/*.png hardware/cables/generated/
          cp cable-export/*.bom.tsv hardware/cables/
          git add hardware/cables/generated/*.png hardware/cables/*.bom.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh cable harness diagrams and BOMs'
          git push origin "HEAD:$SOURCE_BRANCH"
