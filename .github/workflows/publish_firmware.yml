name: Publish immutable firmware candidate

on:
  # Manual runs republish the current branch head after a failed candidate.
  workflow_dispatch:
  push:
    # Versions are allocated and candidates published only for merges into main.
    branches: [main]
    paths:
      # The firmware directory only: a change here allocates the next version and
      # publishes a signed candidate. Keep in sync with FIRMWARE_PATHS in
      # pr-firmware.yml and pr-target-policy.yml. Release tooling changes are
      # exercised by PR checks and republished manually.
      - "software/firmware/**"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: firmware-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  detect_auto_version:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect current-track auto-version commit
        id: detect
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if python software/scripts/release_version.py is-auto-commit --message "$COMMIT_MESSAGE" --track "$GITHUB_REF_NAME"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: detect_auto_version
    if: ${{ needs.detect_auto_version.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'firmware-production' || 'firmware-staging' }}
    env:
      FIRMWARE_PUBLISH_TOKEN: ${{ secrets.FIRMWARE_PUBLISH_TOKEN }}
      FIRMWARE_PROVENANCE_SIGNING_KEY_PEM: ${{ secrets.FIRMWARE_PROVENANCE_SIGNING_KEY_PEM }}
    steps:
      - name: Check publishing credentials
        shell: bash
        run: |
          missing=0
          for credential in FIRMWARE_PUBLISH_TOKEN FIRMWARE_PROVENANCE_SIGNING_KEY_PEM; do
            if [[ -z "${!credential}" ]]; then
              echo "::error::Configure $credential in this track's GitHub environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Generate version-control token
        id: version_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RAD_VERSION_CONTROL_APP_ID }}
          private-key: ${{ secrets.RAD_VERSION_CONTROL_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ steps.version_token.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve merged PR title
        id: pull_request
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.version_token.outputs.token }}
          script: |
            const { data: pulls } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
            const title = pulls.find(
              (pull) =>
                pull.merged_at !== null &&
                pull.base.ref === process.env.GITHUB_REF_NAME,
            )?.title ?? "";
            core.setOutput("title", title);

      - name: Allocate and commit next version
        id: version
        env:
          PR_TITLE: ${{ steps.pull_request.outputs.title }}
          DEVICE_TYPE: ossm
          VERSION_HEADER: software/firmware/src/constants/Version.h
          RELEASE_VERSION: software/scripts/release_version.py
        run: bash .github/scripts/allocate_version.sh
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Test publisher
        run: |
          python .github/scripts/test_download_verified_release.py
          python .github/scripts/test_build_web_installer.py
          python .github/scripts/test_firmware_provenance.py
          python .github/scripts/test_publish_immutable_firmware.py
          python .github/scripts/test_release_workflow.py

      - name: Run release helper tests
        run: python software/scripts/test_release_version.py

      - name: Run native unit tests
        working-directory: software/firmware
        run: pio test -e test

      - name: Select track build
        run: python .github/scripts/release_workflow.py configure --branch "$GITHUB_REF_NAME"

      - name: Build application
        working-directory: software/firmware
        run: pio run -e "$PIO_ENV"

      - name: Checkout V1 firmware with Bluetooth
        if: github.ref_name == 'main'
        uses: actions/checkout@v4
        with:
          ref: 065c1c70d8be0b6ebe3edf536051ca542b793d70 # Legacy source; release version is synchronized below.
          path: legacy-4mb

      - name: Pin legacy 4 MB dependencies
        if: github.ref_name == 'main'
        # The pinned legacy source asks for FastLED ^3.6.0; newer releases no
        # longer compile against it. 3.10.3 matches the current firmware.
        run: |
          sed -i 's#fastled/FastLED@^3.6.0#fastled/FastLED@3.10.3#' legacy-4mb/Software/platformio.ini
          grep -qx '    fastled/FastLED@3.10.3' legacy-4mb/Software/platformio.ini

      - name: Test and build V1 with the allocated version
        if: github.ref_name == 'main'
        run: |
          python software/scripts/release_version.py write --version "${{ steps.version.outputs.version }}" \
            --header legacy-4mb/Software/src/constants/Version.h --version-json legacy-4mb/version.json
          pio test --project-dir legacy-4mb/Software -e test
          pio run --project-dir legacy-4mb/Software -e production -t buildprog
          grep -aFq "$RELEASE_BUILD_SHA" legacy-4mb/Software/.pio/build/production/firmware.bin
          grep -aFq "${{ steps.version.outputs.version }}" legacy-4mb/Software/.pio/build/production/firmware.bin
          test "$(stat --format=%s legacy-4mb/Software/.pio/build/production/firmware.bin)" -le $((0x1E0000 - 0x4000))
          grep -qx 'CONFIG_BT_ENABLED=y' legacy-4mb/Software/sdkconfig.production
          grep -qx 'CONFIG_ESPTOOLPY_FLASHSIZE="4MB"' legacy-4mb/Software/sdkconfig.production
          ~/.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-nm \
            legacy-4mb/Software/.pio/build/production/firmware.elf | grep -E 'NimBLEServer' > /dev/null
          python .github/scripts/build_web_installer.py --flash-size 4MB \
            --build-dir legacy-4mb/Software/.pio/build/production \
            --output legacy-4mb/Software/.pio/build/production/web-installer.bin

      - name: Build merged web installer
        run: |
          python .github/scripts/build_web_installer.py \
            --build-dir "software/firmware/.pio/build/$PIO_ENV" \
            --output "software/firmware/.pio/build/$PIO_ENV/web-installer.bin"

      - name: Publish validating release
        id: publish
        run: |
          python .github/scripts/publish_immutable_firmware.py \
            --device-type ossm \
            --hardware-variant v2 \
            --track "$TRACK" \
            --build-sha "$RELEASE_BUILD_SHA" \
            --version-file software/firmware/src/constants/Version.h \
            --min-flash-size-bytes 16777216 \
            --artifact "application:software/firmware/.pio/build/$PIO_ENV/firmware.bin:1:true" \
            --artifact "bootloader:software/firmware/.pio/build/$PIO_ENV/bootloader.bin:2:false" \
            --artifact "partitions:software/firmware/.pio/build/$PIO_ENV/partitions.bin:3:false" \
            --artifact "web-installer:software/firmware/.pio/build/$PIO_ENV/web-installer.bin:4:false"

      - name: Publish validating V1 release
        if: github.ref_name == 'main'
        id: publish_v1
        run: |
          python .github/scripts/publish_immutable_firmware.py \
            --device-type ossm --hardware-variant v1 --track "$TRACK" \
            --build-sha "$RELEASE_BUILD_SHA" \
            --version-file legacy-4mb/Software/src/constants/Version.h \
            --min-flash-size-bytes 4194304 \
            --artifact "application:legacy-4mb/Software/.pio/build/production/firmware.bin:1:true" \
            --artifact "bootloader:legacy-4mb/Software/.pio/build/production/bootloader.bin:2:false" \
            --artifact "partitions:legacy-4mb/Software/.pio/build/production/partitions.bin:3:false" \
            --artifact "web-installer:legacy-4mb/Software/.pio/build/production/web-installer.bin:4:false"

      - name: Candidate summary
        run: |
          echo "V2 release ${{ steps.publish.outputs.release_id }} is waiting for hardware validation" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${{ steps.publish_v1.outputs.release_id }}" ]]; then
            echo "V1 release ${{ steps.publish_v1.outputs.release_id }} is waiting for hardware validation" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Version: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Build: ${{ steps.version.outputs.release_build_sha }}" >> "$GITHUB_STEP_SUMMARY"
