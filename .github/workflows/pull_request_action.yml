name: PlatformIO CI

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      changes_detected: ${{ steps.check_changes.outputs.changes_detected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for firmware or release workflow changes
        id: check_changes
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -Eq "^(software/firmware/|\.github/scripts/|\.github/workflows/)"; then
            echo "Firmware-affecting changes detected"
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "No firmware-affecting changes detected, skipping build"
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check_changes
    if: needs.check_changes.outputs.changes_detected == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build PlatformIO Project
        run: |
          cd software/firmware
          pio run -e staging
          pio run -e production

      - name: Build merged web installers
        run: |
          for environment in staging production; do
            python .github/scripts/build_web_installer.py \
              --build-dir "software/firmware/.pio/build/$environment" \
              --output "software/firmware/.pio/build/$environment/web-installer.bin"
          done

      - name: Test immutable publisher
        run: |
          python .github/scripts/test_download_verified_release.py
          python .github/scripts/test_build_web_installer.py
          python .github/scripts/test_publish_immutable_firmware.py
          python .github/scripts/test_release_workflow.py

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            software/firmware/.pio/build/production/firmware.bin
            software/firmware/.pio/build/production/partitions.bin
            software/firmware/.pio/build/production/bootloader.bin
            software/firmware/.pio/build/production/web-installer.bin
          retention-days: 14

      - name: Build V1 (4 MB) firmware
        # Mirrors the V1 release build: the current source's production-4mb
        # profile, which must fit the 4 MB OTA slot and keep Bluetooth.
        working-directory: software/firmware
        run: |
          VERSION="$(python ../scripts/release_version.py read --header src/constants/Version.h)"
          RELEASE_BUILD_SHA=$(git rev-parse HEAD) pio run -e production-4mb
          build=.pio/build/production-4mb
          grep -aFq "$(git rev-parse HEAD)" "$build/firmware.bin"
          grep -aFq "$VERSION" "$build/firmware.bin"
          test "$(stat --format=%s "$build/firmware.bin")" -le $((0x1E0000 - 0x4000))
          grep -qx 'CONFIG_BT_ENABLED=y' .pio/sdkconfig.production-4mb
          grep -qx 'CONFIG_ESPTOOLPY_FLASHSIZE="4MB"' .pio/sdkconfig.production-4mb
          ~/.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-nm \
            "$build/firmware.elf" | grep -E 'NimBLEServer' > /dev/null
          python ../../.github/scripts/build_web_installer.py --flash-size 4MB \
            --build-dir "$build" --output "$build/web-installer.bin"

      - name: Upload V1 (4 MB) firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-v1
          path: |
            software/firmware/.pio/build/production-4mb/firmware.bin
            software/firmware/.pio/build/production-4mb/partitions.bin
            software/firmware/.pio/build/production-4mb/bootloader.bin
            software/firmware/.pio/build/production-4mb/web-installer.bin
          if-no-files-found: error
          retention-days: 1

  check:
    needs: check_changes
    if: needs.check_changes.outputs.changes_detected == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Check PlatformIO Project
        run: |
          cd software/firmware
          pio check --skip-packages --fail-on-defect high -e production -f src

  test:
    needs: check_changes
    if: needs.check_changes.outputs.changes_detected == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Unit Test PlatformIO Project
        run: |
          cd software/firmware
          pio test -e test
